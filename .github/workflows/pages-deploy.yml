name: Deploy Documentation to GitHub Pages (Latest Only)

# This is a BACKUP/BACKUP deployment. Primary hosting is on Read the Docs.
# This only builds the "latest" version — no version history.
# Useful for:
#   - Quick diagnostic checks if RTD fails
#   - A fallback if RTD goes down
#   - Direct linking from your repo (e.g., repo.github.io/project)

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build documentation
        run: python3 -m sphinx -b html docs/source docs/_build/html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
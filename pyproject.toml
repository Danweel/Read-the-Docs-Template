[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

# -----------------------------------------------------------------
# PEP 621 metadata (Project Info)
# -----------------------------------------------------------------
# Replace [PROJECTNAME], [DESCRIPTION], [AUTHOR], and [EMAIL] below.
# These placeholders must be updated for the project to be usable.

[project]
name = "PROJECT NAME"
version = "0.1.0"
description = "DESCRIPTION"
readme = "README.md"
license = {text = "CC-BY-SA-4.0"}
# licence files = ["LICENSE"]  #OPTIONAL, points to a licence file
authors = [
    {name = "NAME", email = "AUTHOREMAIL"}, # it does check for an email
    {name = "NAME2"}          # optional second author
]

requires-python = ">=3.11"
# Once this line is present, the resolver no longer falls back to the historic “>=2.7,<2.8” default.

# -----------------------------------------------------------------
# Poetry Configuration
# -----------------------------------------------------------------
# This template is for documentation-only projects — no installable
# Python package. If your project includes a Python package (i.e., you
# need `pip install .` to work), use Read-the-Docs-Template-Package instead:
# https://github.com/Danweel/Read-the-Docs-Template-Package

# Don't need this group with autodoc2 - enable if using standard autodoc
 [tool.poetry]
 package-mode = false
 packages = []
# Tells Poetry not to expect a Python package

# This is for spellchecking.
[tool.codespell]
skip = '*.lock,*.bib,docs/_build,.git,_build,*.svg,*.png,*.ico'
check-hidden = true
ignore-words-list = ''
count = true

# -----------------------------------------------------------------
# Poetry Dependency Groups
# -----------------------------------------------------------------
# Used with: `poetry install --with docs`  OR  --with dev
# Yes, they are the same in this version - there's no differnce between them. 
# This is just to standardize a few of the instructions.
# Read the Docs does NOT read from these; it uses requirements.txt.
# Keep pyproject.toml and these groups in sync when adding packages.

# To regenerate requirements.txt after changes:
#   poetry export -f requirements.txt --output requirements.txt --without-hashes

[tool.poetry.group.docs.dependencies]  # use `poetry install --with docs` for regular contributors (light, strips out unnecessary tools)
sphinx = ">=8.0,<9.0"
sphinx-design = ">=0.6.0"
sphinxcontrib-bibtex = ">=2.6.0"
sphinxcontrib-mermaid = "^2.0.1"
sphinx-copybutton = "^0.5.2"
sphinx-notfound-page = "^1.0.0"
myst-parser = "^5.0.0"
sphinx-autobuild = ">=2024.10.0"
furo = ">=2024.8.6"
groundwork-sphinx-theme = "^1.1.1"
readthedocs-build = "^2.0"
codespell = ">=2.2.0"
sphinxext-opengraph = ">=0.9.0"
sphinx-favicon = ">=2.0.0"
sphinx-hoverxref = ">=1.4.0"
sphinx-tags = ">=0.4.0"
sphinx-last-updated-by-git = ">=1.0.0"
sphinxext-opengraph = ">=0.9.0"
sphinx-version-warning = ">=1.1.0"
sphinx-navtree = ">=0.3.0"
jupinx = ">=0.9.0"
codespell = ">=2.2.0"

[tool.poetry.group.dev.dependencies]   # use `poetry install --with dev` to install everything required to maintain the Read the Docs project.
sphinx = ">=8.0,<9.0"
sphinx-design = ">=0.6.0"
sphinxcontrib-bibtex = ">=2.6.0"
sphinxcontrib-mermaid = "^2.0.1"
sphinx-copybutton = "^0.5.2"
sphinx-notfound-page = "^1.0.0"
myst-parser = "^5.0.0"
sphinx-autobuild = ">=2024.10.0"
furo = ">=2024.8.6"
groundwork-sphinx-theme = "^1.1.1"
readthedocs-build = "^2.0"
codespell = ">=2.2.0"
sphinxext-opengraph = ">=0.9.0"
sphinx-favicon = ">=2.0.0"
sphinx-hoverxref = ">=1.4.0"
sphinx-tags = ">=0.4.0"
sphinx-last-updated-by-git = ">=1.0.0"
sphinxext-opengraph = ">=0.9.0"
sphinx-version-warning = ">=1.1.0"
sphinx-navtree = ">=0.3.0"
jupinx = ">=0.9.0"
codespell = ">=2.2.0"


# -----------------------------------------------------------------
# Theme Alternatives (Choose ONE — Leave the others commented out)
# -----------------------------------------------------------------
# Replace groundwork-sphinx-theme above with one of these if preferred.
# Remember to also update html_theme in docs/source/conf.py.
#
Furo (clean, modern, dark/light mode):
    furo = ">=2024.8.6"
#
# Sphinx RTD Theme (classic, widely recognized):
#   sphinx-rtd-theme = ">=2.0.0"
#
# Sphinx Book Theme (long-form docs, book style):
#   sphinx-book-theme = ">=1.0.0"

# Make sure any packages you add here are reflected in the /docs/source/conf.py 
as well. You may have to look up the name format for both files.

# ──────────────────────────────────────────────────────────────────
# EXTENSION ↔ PACKAGE NAME CHECKLIST
# ──────────────────────────────────────────────────────────────────
# Before committing, if you've changed something, verify each extension in conf.py has its
# corresponding package in pyproject.toml, for example:
#
#   conf.py extension            | pyproject.toml package
#   ─────────────────────────────┼─────────────────────────────────
#   sphinx.ext.intersphinx       | (built-in)
#   sphinx.ext.todo              | (built-in)
#   sphinx.ext.mathjax           | sphinx (built-in)
#   myst_parser                  | myst-parser
#   sphinx_design                | sphinx-design
#   sphinxcontrib.mermaid        | sphinxcontrib-mermaid
#   sphinxcontrib.bibtex         | sphinxcontrib-bibtex
#   notfound.extension           | sphinx-notfound-page
#   sphinx_copybutton            | sphinx-copybutton
#   sphinx_favicon               | sphinx-favicon
#   sphinx_hoverxref             | sphinx-hoverxref
#   sphinx_tags                  | sphinx-tags
#   sphinx_navtree               | sphinx-navtree
#   sphinx_last_updated_by_git   | sphinx-last-updated-by-git
#   sphinxext.opengraph          | sphinxext-opengraph
#   sphinx_version_warning       | sphinx-version-warning
#   jupinx                       | jupinx
#   sphinxcontrib.spelling       | sphinxcontrib-spelling
#
#   Tip: Extension names often differ from package names!
#        Example: sphinx-copybutton (pip) → sphinx_copybutton (conf.py)
# ──────────────────────────────────────────────────────────────────
